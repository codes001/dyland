    <meta charset="UTF-8" />

    <title>dyland</title>
    <script>
      // Pre-paint: mark Tauri so the canvas background stays transparent
      // (avoids a black flash and an opaque window in the island overlay).
      if ("__TAURI_INTERNALS__" in window) {
        document.documentElement.setAttribute("data-tauri", "true");
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
