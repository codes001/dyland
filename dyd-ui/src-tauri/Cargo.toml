[package]
name = "dyd-ui-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "dyd_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Required for release builds: embeds the frontend and serves it via the
# tauri:// custom protocol. Without it, release binaries try to load the
# dev server (http://localhost:5173) and fail with "Connection refused".
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "io-util", "net", "macros"] }
dyd-types = { path = "../../types" }
